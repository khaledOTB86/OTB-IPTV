name: otb_iptv
description: High-performance IPTV Player with Xtream Codes support.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.7
  dio: ^5.4.0
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  cached_network_image: ^3.3.1
  flutter_spinkit: ^5.2.0
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
